[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer_mla_fp4_native"
version = "0.1.0"
description = "Native FP4 QK MLA decode with a shared payload and dual scales"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer_mla_fp4_native*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
