[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer_mla_fp4_fused_dequant"
version = "0.1.0"
description = "NVFP4 MLA decode with native QK and fused FP8 V dequantization"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer_mla_fp4_fused_dequant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
